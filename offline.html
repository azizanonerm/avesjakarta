<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f2d5a">
    <title>Tidak Ada Koneksi - AVES</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f1f3ff;
            color: #0f2d5a;
            font-family: Arial, sans-serif;
        }
        main {
            width: min(100%, 520px);
            padding: 40px 32px;
            border: 1px solid #c7d7f2;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 18px 50px rgba(15, 45, 90, 0.12);
            text-align: center;
        }
        .brand-logo {
            display: block;
            width: 180px;
            height: auto;
            margin: 0 auto 24px;
        }
        h1 { margin: 0 0 12px; font-size: 28px; }
        p { margin: 0 0 26px; color: #48556a; line-height: 1.6; }
        a {
            display: inline-flex;
            padding: 12px 20px;
            border-radius: 10px;
            background: #0868c9;
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <img class="brand-logo" src="assets/branding/aves-blue.png" alt="AVES - Avian &amp; Exotic Animal Veterinary Services Jakarta">
        <h1>Anda sedang offline</h1>
        <p>Sambungkan perangkat ke internet untuk mengakses konsultasi, riwayat diagnosis, dan data akun dengan aman.</p>
        <a href="index.html">Coba Kembali</a>
    </main>
</body>
</html>
